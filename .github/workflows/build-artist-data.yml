name: Build artist dex data

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-artist-data.yml"
      - "scripts/build_artist_data.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build artist data from public Google Sheet
        run: python scripts/build_artist_data.py data/artists.json
      - name: Publish generated artist data
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          ENDPOINT="repos/${GITHUB_REPOSITORY}/contents/data/artists.json"
          EXISTING_SHA="$(gh api --method GET "${ENDPOINT}" -f ref="${TARGET_BRANCH}" --jq .sha 2>/dev/null || true)"
          LOCAL_SHA="$(git hash-object data/artists.json)"
          if [ "${EXISTING_SHA}" = "${LOCAL_SHA}" ]; then
            echo "Artist data is already current."
            exit 0
          fi
          python - "${TARGET_BRANCH}" "${EXISTING_SHA}" <<'PY'
          import base64
          import json
          import sys
          from pathlib import Path

          branch, existing_sha = sys.argv[1:3]
          payload = {
              "message": "Update artist dex data",
              "branch": branch,
              "content": base64.b64encode(Path("data/artists.json").read_bytes()).decode("ascii"),
          }
          if existing_sha:
              payload["sha"] = existing_sha
          Path("/tmp/artist-data-payload.json").write_text(json.dumps(payload), encoding="utf-8")
          PY
          gh api --method PUT "${ENDPOINT}" --input /tmp/artist-data-payload.json

name: Build pack images

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-pack-images.yml"
      - "scripts/build_pack_sprite.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tools
        run: pip install openpyxl pillow
      - name: Download public collection sheet
        run: curl --fail --location "https://docs.google.com/spreadsheets/d/1sf3bCPPYUPqMlJ5O4x1OWmflJI6IhJBkJozwC4CkePk/export?format=xlsx" --output /tmp/pack-collection.xlsx
      - name: Build optimized sprite
        run: python scripts/build_pack_sprite.py /tmp/pack-collection.xlsx assets/packs/pack-sprite.webp
      - name: Publish generated image
        run: |
          if git diff --quiet -- assets/packs/pack-sprite.webp; then
            echo "Pack image is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/packs/pack-sprite.webp
          git commit -m "Update pack collection images"
          git push
